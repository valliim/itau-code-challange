spring:
  application:
    name: itau-code-challange
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:authorization-account-created-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:}
  region: ${DYNAMODB_REGION:us-east-1}
  use-static-credentials: ${DYNAMODB_USE_STATIC_CREDENTIALS:false}
  static-access-key: ${DYNAMODB_STATIC_ACCESS_KEY:local}
  static-secret-key: ${DYNAMODB_STATIC_SECRET_KEY:local}
  accounts-table-name: ${ACCOUNTS_TABLE_NAME:Accounts}
  transactions-table-name: ${TRANSACTIONS_TABLE_NAME:Transactions}
  api-call-timeout: ${DYNAMODB_API_CALL_TIMEOUT:5s}
  api-call-attempt-timeout: ${DYNAMODB_API_CALL_ATTEMPT_TIMEOUT:2s}

accounts:
  topic-name: ${ACCOUNTS_TOPIC:conta-bancaria-criada}
  dead-letter-suffix: ${ACCOUNTS_DEAD_LETTER_SUFFIX:.DLT}
  retry-interval-millis: ${ACCOUNTS_RETRY_INTERVAL_MILLIS:1000}
  max-retries: ${ACCOUNTS_MAX_RETRIES:2}
  dead-letter-partitions: ${ACCOUNTS_DEAD_LETTER_PARTITIONS:1}
  dead-letter-replication-factor: ${ACCOUNTS_DEAD_LETTER_REPLICATION_FACTOR:1}

logging:
  level:
    br.com.itau.challenge: ${LOG_LEVEL_APP:INFO}
  pattern:
    level: '%5p [transactionId=%X{transactionId:-} accountId=%X{accountId:-}]'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakerevents,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      dynamodb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50.0
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - software.amazon.awssdk.core.exception.SdkException
          - java.io.IOException
        ignore-exceptions:
          - software.amazon.awssdk.services.dynamodb.model.ConditionalCheckFailedException
  retry:
    instances:
      dynamodb:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - software.amazon.awssdk.core.exception.SdkException
          - java.io.IOException
        ignore-exceptions:
          - software.amazon.awssdk.services.dynamodb.model.ConditionalCheckFailedException
